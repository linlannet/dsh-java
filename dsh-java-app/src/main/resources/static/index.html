<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>DeepSeek Harness · Java Edition</title>
  <script>
    // 统一缓存破除版本号：同一次页面加载内所有静态资源共用，强制浏览器拉取最新
    window.__ASSET_V__ = Date.now();
    window.__loadCss__ = function (href, id) {
      var l = document.createElement('link');
      l.rel = 'stylesheet';
      l.href = href + (href.indexOf('?') >= 0 ? '&' : '?') + 'v=' + window.__ASSET_V__;
      if (id) l.id = id;
      document.head.appendChild(l);
      return l;
    };
    window.__loadCss__('/app.css', 'app-css');
  </script>
  <script>
    window.onerror = function(msg, src, line, col, err) {
      var d = document.getElementById('error-display');
      if (!d) {
        d = document.createElement('div');
        d.id = 'error-display';
        d.style.cssText = 'position:fixed;top:10px;left:10px;right:10px;background:#ff4444;color:#fff;padding:16px;border-radius:8px;z-index:99999;font-family:monospace;font-size:13px;white-space:pre-wrap;max-height:80vh;overflow:auto;';
        (document.body || document.documentElement).appendChild(d);
      }
      d.textContent += 'Error: ' + msg + '\nSource: ' + src + ':' + line + ':' + col + '\n' + (err && err.stack ? err.stack : '') + '\n\n';
    };
  </script>
  <script>
    // 带版本号加载 JS 库，避免浏览器缓存旧版本
    window.__loadJs__ = function (src) {
      document.write('<script src="' + src + (src.indexOf('?') >= 0 ? '&' : '?') + 'v=' + window.__ASSET_V__ + '"><\/script>');
    };
    window.__loadJs__('/lib/marked.min.js');
    window.__loadJs__('/lib/purify.min.js');
    window.__loadJs__('/lib/highlight.min.js');
    window.__loadCss__('/lib/github-dark.min.css');
  </script>
</head>
<body>
  <div id="app"></div>
  <noscript style="color:red;position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);">请启用 JavaScript</noscript>
  <script>
    window.__loadJs__('/app.js');
  </script>
</body>
</html>
