server:
  port: 8090

logging:
  level:
    net.linlan.dsh: info

spring:
  application:
    name: dsh-java
  # Web 端附件上传（POST /api/agent/attachments）与插件 JAR 分析共用 multipart；
  # 默认 1MB 会直接拒掉常规文件，放宽到 30MB（服务端控制器另有二次校验）
  servlet:
    multipart:
      max-file-size: 30MB
      max-request-size: 35MB
  # 静态资源禁启发式缓存：Spring 默认只发 Last-Modified，浏览器会按启发式规则
  # 缓存 index.html / app.js 数小时，导致改了前端代码刷新后仍加载旧版本
  # （曾引发"附件选完不显示"等假象）。强制每次校验，保证拿到最新静态资源。
  web:
    resources:
      cache:
        cachecontrol:
          no-cache: true
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/dsh_java?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: lldba
    password: DB_Lldba_2023!
    driver-class-name: com.mysql.cj.jdbc.Driver

    hikari:
      initialization-fail-timeout: 0
      connection-timeout: 3000
      validation-timeout: 2000
      minimum-idle: 1
      maximum-pool-size: 10
      keepalive-time: 30000
      max-lifetime: 600000
      leak-detection-threshold: 30000
  sql:
    init:
      mode: always
      encoding: UTF-8
  config:
    import:
      - optional:classpath:harness.yml
      - optional:file:./harness.yml
      - optional:classpath:harness-extensions.yml
      - optional:file:./harness-extensions.yml
mybatis:
  configuration:
    map-underscore-to-camel-case: true
    default-fetch-size: 100
    default-statement-timeout: 30

# 运维健康检查：仅暴露 health/info，避免泄漏运行时细节
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
  health:
    db:
      enabled: true

# 微信小程序登录（AppID / AppSecret 取自微信公众平台 → 开发管理 → 开发设置）
# 未配置时 /api/miniapp/login 返回 50300，不会降级为匿名登录；AppSecret 只允许在服务端配置。
dsh:
  # 企业身份（linlan-emis OIDC）；client-secret 仅允许环境变量注入
  emis:
    oidc:
      enabled: ${DSH_EMIS_OIDC_ENABLED:false}
      base-url: ${DSH_EMIS_OIDC_BASE_URL:http://localhost:8080}
      client-id: ${DSH_EMIS_OIDC_CLIENT_ID:}
      client-secret: ${DSH_EMIS_OIDC_CLIENT_SECRET:}
      redirect-uri: ${DSH_EMIS_OIDC_REDIRECT_URI:http://localhost:8090/api/emis/callback}
      scopes: ${DSH_EMIS_OIDC_SCOPES:openid profile tenant}
      issuer: ${DSH_EMIS_OIDC_ISSUER:http://localhost:8080}
      post-logout-redirect-uri: ${DSH_EMIS_OIDC_POST_LOGOUT_REDIRECT_URI:http://localhost:8090/}
      timeout-ms: ${DSH_EMIS_OIDC_TIMEOUT_MS:3000}
  office:
    output-directory: ${DSH_HOME:${user.home}/.dsh}/office-kit/outputs
    output-retention-ms: 86400000
    max-output-store-bytes: 268435456
    python-environment: workspace-dependencies
  miniapp:
    wechat:
      appid: ${DSH_MINIAPP_WECHAT_APPID:}
      secret: ${DSH_MINIAPP_WECHAT_SECRET:}
